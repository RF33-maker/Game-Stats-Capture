openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Swish Stats — basketball stat capture API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: games
    description: Game management
  - name: teams
    description: Team management
  - name: players
    description: Player management
  - name: stats
    description: Stat capture
  - name: pbp
    description: Play-by-play
  - name: aggregates
    description: Computed aggregates (box score, possessions)
  - name: seed
    description: Dev seed helpers
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: leagues
    description: League hub — orgs that own games and have member roles.
  - name: memberships
    description: Per-league user memberships and roles.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /leagues:
    get:
      operationId: listLeagues
      tags: [leagues]
      summary: List all leagues the current user can access
      responses:
        "200":
          description: List of leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
    post:
      operationId: createLeague
      tags: [leagues]
      summary: Create a new league (current user becomes admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueBody"
      responses:
        "201":
          description: League created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"

  /leagues/{leagueId}:
    get:
      operationId: getLeague
      tags: [leagues]
      summary: Get a single league
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: League
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLeague
      tags: [leagues]
      summary: Update a league (admin only)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueBody"
      responses:
        "200":
          description: Updated league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteLeague
      tags: [leagues]
      summary: Delete a league (admin only)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /leagues/{leagueId}/games:
    get:
      operationId: listLeagueGames
      tags: [leagues]
      summary: List games belonging to a league
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: League games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createLeagueGame
      tags: [leagues]
      summary: Create a new game inside a league (admin only)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /leagues/{leagueId}/activity:
    get:
      operationId: listLeagueActivity
      tags: [leagues]
      summary: Recent activity feed for a league (finalized games + new members)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return (default 20, max 50).
          schema:
            type: integer
      responses:
        "200":
          description: Activity entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueActivityEntry"

  /leagues/{leagueId}/members:
    get:
      operationId: listLeagueMembers
      tags: [memberships]
      summary: List memberships for a league
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: League memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueMember"
    post:
      operationId: addLeagueMember
      tags: [memberships]
      summary: Add a member to a league (admin only)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLeagueMemberBody"
      responses:
        "201":
          description: Added membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueMember"

  /leagues/{leagueId}/members/{userId}:
    patch:
      operationId: updateLeagueMember
      tags: [memberships]
      summary: Change a member's role (admin only)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueMemberBody"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueMember"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeLeagueMember
      tags: [memberships]
      summary: Remove a member from a league (admin only)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all games
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Create a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{gameId}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a single game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameBody"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGame
      tags: [games]
      summary: Delete a game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{gameId}/teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams in a game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team for a game
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamBody"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{teamId}:
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamBody"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{gameId}/players:
    get:
      operationId: listGamePlayers
      tags: [players]
      summary: List all players across both teams of a game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"

  /teams/{teamId}/players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List players on a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a player on a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerBody"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{playerId}:
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Delete a player
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{gameId}/stats:
    get:
      operationId: listStatEvents
      tags: [stats]
      summary: List all stat events for a game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Stat events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatEvent"
    post:
      operationId: recordStatEvent
      tags: [stats]
      summary: Record a stat event (also updates play-by-play and possession)
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordStatEventBody"
      responses:
        "201":
          description: Stat event recorded with derived play-by-play row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatEventResult"

  /games/{gameId}/substitutions:
    post:
      operationId: substitutePlayers
      tags: [stats]
      summary: Atomically substitute a bench player in for an on-court player
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubstitutePlayersBody"
      responses:
        "201":
          description: Substitution recorded as a paired sub-out/sub-in stat event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubstitutionResult"
        "400":
          description: Invalid substitution (e.g. player not on court/bench)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats/{statEventId}:
    patch:
      operationId: updateStatEvent
      tags: [stats]
      summary: Edit a recorded stat event (corrects player, team, or event type) and rebuilds play-by-play
      parameters:
        - $ref: "#/components/parameters/StatEventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatEventBody"
      responses:
        "200":
          description: Updated stat event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatEvent"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStatEvent
      tags: [stats]
      summary: Undo a stat event (also removes its play-by-play row)
      parameters:
        - $ref: "#/components/parameters/StatEventId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{gameId}/play-by-play:
    get:
      operationId: listPlayByPlay
      tags: [pbp]
      summary: Full play-by-play feed for a game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Play-by-play entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayByPlayEntry"
    post:
      operationId: createPlayByPlay
      tags: [pbp]
      summary: Insert a manual play-by-play entry (text-only, no stat event)
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayByPlayBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayByPlayEntry"

  /play-by-play/{pbpId}:
    patch:
      operationId: updatePlayByPlay
      tags: [pbp]
      summary: Edit a play-by-play entry's text or score line
      parameters:
        - $ref: "#/components/parameters/PbpId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayByPlayBody"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayByPlayEntry"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePlayByPlay
      tags: [pbp]
      summary: Delete a play-by-play entry
      parameters:
        - $ref: "#/components/parameters/PbpId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{gameId}/box-score:
    get:
      operationId: getBoxScore
      tags: [aggregates]
      summary: Computed box score for a game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Box score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoxScore"

  /games/{gameId}/possessions:
    get:
      operationId: getPossessions
      tags: [aggregates]
      summary: Possession counts per team
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Possession counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PossessionSummary"

  /games/{gameId}/clock:
    patch:
      operationId: updateClock
      tags: [games]
      summary: Update the live clock and current period
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClockBody"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /seed:
    post:
      operationId: seedSampleGame
      tags: [seed]
      summary: Insert a sample game with two teams and rosters
      responses:
        "201":
          description: Seeded game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    LeagueId:
      name: leagueId
      in: path
      required: true
      schema:
        type: integer
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: integer
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
    PlayerId:
      name: playerId
      in: path
      required: true
      schema:
        type: integer
    StatEventId:
      name: statEventId
      in: path
      required: true
      schema:
        type: integer
    PbpId:
      name: pbpId
      in: path
      required: true
      schema:
        type: integer
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LeagueRole:
      type: string
      enum: [viewer, scorer, admin]

    League:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        season:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        ownerUserId:
          type: ["string", "null"]
        viewerRole:
          $ref: "#/components/schemas/LeagueRole"
        createdAt:
          type: string
          format: date-time
      required: [id, name, viewerRole, createdAt]

    CreateLeagueBody:
      type: object
      properties:
        name:
          type: string
        season:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
      required: [name]

    UpdateLeagueBody:
      type: object
      properties:
        name:
          type: string
        season:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]

    LeagueMember:
      type: object
      properties:
        leagueId:
          type: integer
        userId:
          type: string
        role:
          $ref: "#/components/schemas/LeagueRole"
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        createdAt:
