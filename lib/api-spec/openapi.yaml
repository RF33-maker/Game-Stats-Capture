    SubstitutePlayersBody:
      type: object
      description: >
        Atomically swaps one on-court player for one bench player on the same
        team. Both the sub-out and sub-in stat events are written in a single
        transaction after validating current lineup state server-side, so a
        substitution can never leave the game with a player missing.
      properties:
        teamId:
          type: integer
        outPlayerId:
          type: integer
          description: Currently on-court player being substituted out.
        inPlayerId:
          type: integer
          description: Currently benched player being substituted in.
        period:
          type: integer
        clockSeconds:
          type: integer
      required: [teamId, outPlayerId, inPlayerId, period, clockSeconds]

    SubstitutionResult:
      type: object
      properties:
        outEvent:
          $ref: "#/components/schemas/StatEvent"
        inEvent:
          $ref: "#/components/schemas/StatEvent"
        outPlayByPlay:
          $ref: "#/components/schemas/PlayByPlayEntry"
        inPlayByPlay:
          $ref: "#/components/schemas/PlayByPlayEntry"
        game:
          $ref: "#/components/schemas/Game"
      required: [outEvent, inEvent, outPlayByPlay, inPlayByPlay, game]

