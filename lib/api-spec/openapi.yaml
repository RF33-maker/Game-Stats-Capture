        ftSequenceIndex:
          type: ["integer", "null"]
        ftSequenceTotal:
          type: ["integer", "null"]
        shotZone:
          anyOf:
            - $ref: "#/components/schemas/ShotZone"
            - type: "null"
      required: [period, clockSeconds, eventType]

    UpdateStatEventBody:
      type: object
      description: Partial update — any field omitted is left unchanged.
      properties:
        teamId:
          type: ["integer", "null"]
        playerId:
          type: ["integer", "null"]
