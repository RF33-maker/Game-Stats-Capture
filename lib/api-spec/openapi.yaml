    ShotZone:
      type: string
      description: >
        Coarse shot-location zone on a standardized halfcourt shot chart.
        Only meaningful for field-goal make/miss events (2ptm/2pta/3ptm/3pta).
      enum:
        - paint
        - left_short_corner
        - right_short_corner
        - left_corner_three
        - right_corner_three
        - left_baseline_midrange
        - right_baseline_midrange
        - top_key_midrange
        - left_wing_three
        - right_wing_three
        - top_arc_three

    StatEvent:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        teamId:
          type: ["integer", "null"]
        playerId:
          type: ["integer", "null"]
        period:
          type: integer
        clockSeconds:
          type: integer
        eventType:
          $ref: "#/components/schemas/StatEventType"
        value:
          type: integer
        ftSequenceIndex:
          type: ["integer", "null"]
        ftSequenceTotal:
          type: ["integer", "null"]
        possessionTeamId:
          type: ["integer", "null"]
        shotZone:
          anyOf:
            - $ref: "#/components/schemas/ShotZone"
            - type: "null"
        needsReview:
          type: boolean
          description: >
            Scorer-set flag meaning "come back and double-check this play
            later." Purely advisory.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - gameId
        - period
        - clockSeconds
        - eventType
        - value
        - needsReview
        - createdAt

